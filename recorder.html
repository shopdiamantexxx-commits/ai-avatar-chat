<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>画面レコーダー</title>
<style>
  body { font-family: sans-serif; background:#111; color:#fff; text-align:center; padding:40px 20px; }
  button { font-size:34px; padding:26px 54px; border-radius:16px; border:none; cursor:pointer; margin:14px; }
  #startBtn { background:#e0245e; color:#fff; }
  #stopBtn { background:#444; color:#fff; }
  #stopBtn.recording { background:#ffcf3f; color:#000; }
  #status { font-size:26px; margin:24px; min-height:40px; }
  #timer { font-size:64px; font-weight:bold; margin:10px; }
  video { width:min(90vw,900px); background:#000; border-radius:12px; }
  a#dl { display:none; font-size:28px; color:#6cf; margin:20px; }
</style>
</head>
<body>
<h1>画面レコーダー</h1>
<div id="status">「録画スタート」を押して、共有ピッカーで宣伝メーカーのタブを選んでください</div>
<div id="timer">0:00</div>
<button id="startBtn">● 録画スタート</button>
<button id="stopBtn" disabled>■ 停止して保存</button>
<br>
<video id="prev" autoplay muted playsinline></video>
<a id="dl">recording.webm をダウンロード</a>
<script>
let rec, chunks = [], stream, t0, timerId;
const status = document.getElementById('status');
const timer = document.getElementById('timer');
document.getElementById('startBtn').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
  } catch (e) {
    status.textContent = 'エラー: ' + e.name + ' ' + e.message;
    return;
  }
  document.getElementById('prev').srcObject = stream;
  chunks = [];
  rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.getElementById('dl');
    a.href = url; a.download = 'creation_recording.webm';
    a.style.display = 'block';
    a.textContent = 'recording.webm をダウンロード（' + Math.round(blob.size/1024) + ' KB）';
    status.textContent = '録画が終わりました。下のリンクからダウンロードしてください';
    const auto = document.createElement('a');
    auto.href = url; auto.download = 'creation_recording.webm';
    document.body.appendChild(auto); auto.click();
  };
  rec.start(1000);
  t0 = Date.now();
  timerId = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    timer.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }, 500);
  status.textContent = '録画中… 宣伝メーカーのタブに切り替えて、実際に動画を作ってください';
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('stopBtn').className = 'recording';
  document.getElementById('startBtn').disabled = true;
};
document.getElementById('stopBtn').onclick = () => {
  clearInterval(timerId);
  if (rec && rec.state !== 'inactive') rec.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
};
</script>
</body>
</html>
